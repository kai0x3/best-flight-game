<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ridgeline Courier — a bush-plane flight game</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #101820;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { display: block; touch-action: none; cursor: crosshair; }
  .corner { position: fixed; top: 10px; z-index: 30; display: flex; gap: 8px; }
  .corner.right { right: 10px; }
  .corner button { background: rgba(12,18,28,0.65); color: #fff; border: 1px solid rgba(255,255,255,0.35);
    border-radius: 8px; padding: 7px 12px; font: 600 13px system-ui, sans-serif; cursor: pointer; }
  .corner button:hover { background: rgba(12,18,28,0.85); }
  #overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(10,16,26,0.25), rgba(10,16,26,0.62)); padding: 20px; }
  #overlay.hidden { display: none; }
  /* Staged "mission complete" screenshot: the debrief card sits left so the
     parked plane and the valley stay visible on the right. */
  body.shot-complete #overlay { justify-content: flex-start; padding-left: 48px; }
  .card { background: rgba(14,22,34,0.92); border: 1px solid rgba(255,210,77,0.45); border-radius: 16px;
    padding: 28px 32px; max-width: 560px; width: 100%; color: #f2f4f7;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55); }
  .card.wide { max-width: 640px; }
  .kicker { color: #ffd24d; font: 700 12px system-ui, sans-serif; letter-spacing: 0.14em; margin-bottom: 8px; }
  h1 { margin: 0 0 10px; font-size: 34px; line-height: 1.1; }
  .brief { margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: #d6dde6; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .facts div { background: rgba(255,255,255,0.07); border-radius: 10px; padding: 10px 12px; }
  .facts span { display: block; font-size: 11px; color: #9fb0c3; text-transform: uppercase; letter-spacing: 0.06em; }
  .facts b { font-size: 16px; color: #fff; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-bottom: 20px;
    font-size: 13px; color: #c8d3df; }
  .controls b { color: #ffd24d; }
  button.primary { display: block; width: 100%; padding: 13px; margin-top: 6px; border: none; border-radius: 10px;
    background: #ffd24d; color: #1a1405; font: 700 16px system-ui, sans-serif; cursor: pointer; }
  button.primary:hover { background: #ffe08a; }
  button.ghost { display: block; width: 100%; padding: 11px; margin-top: 8px; border-radius: 10px;
    background: transparent; color: #dfe7ef; border: 1px solid rgba(255,255,255,0.35);
    font: 600 14px system-ui, sans-serif; cursor: pointer; }
  button.ghost:hover { background: rgba(255,255,255,0.08); }
  .missions { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .mission { text-align: left; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 10px; padding: 12px 14px; color: #fff; cursor: pointer; }
  .mission:hover { border-color: #ffd24d; background: rgba(255,210,77,0.12); }
  .mission b { display: block; font-size: 15px; }
  .mission span { font-size: 12px; color: #aebccb; }
  .rating { display: inline-block; font: 800 18px system-ui, sans-serif; letter-spacing: 0.1em;
    padding: 6px 14px; border-radius: 999px; margin-bottom: 16px; }
  .rating.gold { background: #ffd24d; color: #241a02; }
  .rating.silver { background: #cfd8e3; color: #1c2733; }
  .rating.bronze { background: #c98a4b; color: #241505; }
  .score-line { font-size: 16px; margin: 4px 0 16px; }
  .fine { font-size: 12px; color: #93a5b8; text-align: center; margin: 14px 0 0; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="corner right">
  <button id="muteBtn" type="button">🔊 Sound on</button>
  <button id="pauseBtn" type="button">⏸ Pause</button>
</div>
<div id="overlay"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
